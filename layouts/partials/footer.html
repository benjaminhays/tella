<footer class="bg-tlgray-100">
  {{ if not .IsHome }}
  <script src='{{ "/js/clipboard.min.js" | relURL }}'></script>
  <script src='{{ "/js/highlight.min.js" | relURL }}'></script>
  <script src='{{ "/js/highlightjs-line-numbers.min.js" | relURL }}'></script>
  <script src='{{ "/js/sweetalert2.min.js" | relURL }}'></script>
  <script>
    hljs.initHighlightingOnLoad();
    hljs.initLineNumbersOnLoad();
    new ClipboardJS('.url');

    function OnClickURL() {
      Swal.fire({
        icon: 'success',
        title: 'Copied!',
        text: 'Copied the URL and title.'
      })
    }
  </script>
  {{ end }}
  <script>
    function toggleNav() {
      var hamburger = document.getElementById("hamburgerbtn");
      var overlay = document.getElementById("overlay");
      var body = document.body;

      hamburger.addEventListener("click", function () {
        overlay.classList.toggle("open");
        hamburger.classList.toggle("is-open");
        body.classList.toggle("scroll-lock");
      });
    }
    toggleNav();

    document.querySelector('.scroll-top').addEventListener('click', () => {
      document.documentElement.scrollTop = 0;
    });
  </script>
  <!-- Sponsors Section -->
  <div class="flex items-center justify-center flex-wrap bg-gray-50 p-6 border-b-2 border-gray-400">
    <div class="w-full max-w-6xl">
      <h2 class="text-center text-2xl font-bold text-gray-800 mb-6">Event Sponsors</h2>
      <style>
        .sponsor-logos {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          gap: 0.75rem;
          width: 100%;
        }
        .sponsor-logos img {
          height: 8em;
          width: auto;
          flex-shrink: 0;
        }
        @media (max-width: 1024px) {
          .sponsor-logos img {
            height: 6em;
          }
        }
        @media (max-width: 768px) {
          .sponsor-logos img {
            height: 4.5em;
          }
        }
        @media (max-width: 480px) {
          .sponsor-logos img {
            height: 3.5em;
          }
        }
      </style>
      <div class="sponsor-logos">
        <a href="https://walpolebank.com/" class="flex items-center justify-center">
          <img alt="SBW" src="/img/sbw.webp" loading="lazy" />
        </a>
        <a href="https://www.fentondealerships.com/" class="flex items-center justify-center">
          <img alt="Fenton Family Dealers" src="/img/fenton.webp" loading="lazy" />
        </a>
        <a href="https://www.cswg.com/" class="flex items-center justify-center">
          <img alt="C&S Grocers" src="/img/csgrocers.webp" loading="lazy" />
        </a>
        <a href="https://mascoma.bank/" class="flex items-center justify-center">
          <img alt="Mascoma Bank" src="/img/mascoma.webp" loading="lazy" />
        </a>
        <a href="https://www.cheshiremed.org/" class="flex items-center justify-center">
           <img alt="Cheshire Medical" src="/img/dh.png" class="flex items-center justify-center">
        </a>
      </div>
    </div>
  </div>

          }
        }
