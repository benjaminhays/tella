<footer class="bg-tlgray-100">
  {{ if not .IsHome }}
  <script src='{{ "/js/clipboard.min.js" | relURL }}'></script>
  <script src='{{ "/js/highlight.min.js" | relURL }}'></script>
  <script src='{{ "/js/highlightjs-line-numbers.min.js" | relURL }}'></script>
  <script src='{{ "/js/sweetalert2.min.js" | relURL }}'></script>
  <script>
    hljs.initHighlightingOnLoad();
    hljs.initLineNumbersOnLoad();
    new ClipboardJS('.url');

    function OnClickURL() {
      Swal.fire({
        icon: 'success',
        title: 'Copied!',
        text: 'Copied the URL and title.'
      })
    }
  </script>
  {{ end }}
  <script>
    function toggleNav() {
      var hamburger = document.getElementById("hamburgerbtn");
      var overlay = document.getElementById("overlay");
      var body = document.body;

      hamburger.addEventListener("click", function () {
        overlay.classList.toggle("open");
        hamburger.classList.toggle("is-open");
        body.classList.toggle("scroll-lock");
      });
    }
    toggleNav();

    document.querySelector('.scroll-top').addEventListener('click', () => {
      document.documentElement.scrollTop = 0;
    });
  </script>
  {{ if .Site.Params.googleFonts }}
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Open+Sans&display=swap" rel="stylesheet" />
  {{ else }}
  <link href='{{ "css/webfonts.min.css" | relURL }}' rel="stylesheet" />
  {{ end }}
  <div class="flex items-center justify-center flex-wrap bg-gray-800 p-6 text-white">
    <div class="w-full max-w-6xl items-center text-xl text-grey-900 text-center">
      <style>
        .footer-logos {
          display: flex;
          flex-direction: column;
          gap: 0.8rem;
          justify-content: center;
          align-items: center;
        }
        .footer-logos-row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          gap: 0.75rem;
          width: 100%;
        }
        .footer-logos-row img {
          height: 4em;
          width: auto;
          flex-shrink: 0;
        }
        .footer-logos-row img.logo-light {
          background-color: white;
          padding: 0.2rem;
        }
        @media (max-width: 1024px) {
          .footer-logos-row img {
            height: 3em;
          }
        }
        @media (max-width: 768px) {
          .footer-logos-row img {
            height: 2.2em;
          }
        }
        @media (max-width: 480px) {
          .footer-logos-row img {
            height: 1.8em;
          }
        }
      </style>
      <div class="footer-logos">
        <div class="footer-logos-row">
          <img alt="Monadnock 250 Logo" src="/img/newlogo.webp">
          <img alt="NH 250 Logo" src="/img/nh250-secondary.webp">
          <img alt="America 250" class="logo-light" src="/img/america250.svg">
          <img alt="Arts Alive Logo" src="/img/arts-alive.webp">
          <img alt="Keene Sentinel Logo" src="/img/sentinel.webp">
        </div>
        <div class="footer-logos-row">
          <img alt="City Logo" src="/img/cok.webp">
          <img alt="Historical Society Logo" src="/img/hscc.webp">
          <img alt="Savings Bank of Walpole Logo" class="logo-light" src="/img/sbw.webp">
          <img alt="Swampbats Logo" src="/img/swampbats.webp">
          <img alt="MMG" class="logo-light" src="/img/mmg.webp">
          <img alt="DAR" class="logo-light" src="/img/dar.webp">
        </div>
      </div>
    </div>
  </div>
  <div class="copy pl-8 py-5 bg-tlgray-700 text-white text-md text-center">
    A product of the Monadnock 250 Committee. All rights reserved. Site by <a href="https://benhays.org" class="underline">Benjamin Hays</a>.
  </div>
</footer>
