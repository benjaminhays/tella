<style>
  .facebook-embed-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .facebook-embed-container iframe {
    max-width: 100%;
    width: 100%;
    height: auto;
  }

  @media (min-width: 768px) {
    .facebook-embed-container iframe {
      width: 500px;
      height: 400px;
    }
  }

  @media (max-width: 767px) {
    .facebook-embed-container iframe {
      width: 100%;
      height: 400px;
    }
  }

  ._1drn {
    border: none !important;
  }
</style>

{{if .Site.Data.features}}
<div class="bg-tlgray-200 py-6 md:py-10">
  <div class="container mx-auto max-w-7xl">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
      {{ range .Site.Data.features }} {{if .link }}<a
        href="{{ .link }}"
        target="_blank"
        >{{ end }}
        <div
          class="bg-white text-center mx-2 px-4 py-10 flex flex-row justify-center items-center duration-300 transform h-full hover:-translate-y-1 hover:shadow-lg"
        >
          <div class="p-1">
            {{if .icon }}
            <span class="{{ .icon }} text-5xl"></span>
            {{ end }}
            <h2 class="text-2xl">{{ .title }}</h2>
            <p class="sans">{{ .description | markdownify }}</p>
          </div>
        </div>
        {{if .link }} </a
      >{{ end }} {{ end }}
    </div>
  </div>
</div>
{{end}}
